version: 0.2

# CodeBuild spec for the v25 fork.
# Builds two images and pushes both to 304975023707.dkr.ecr.us-east-1.amazonaws.com/ragflow:
#   - :v25         -> Dockerfile.lambda (production AWS Lambda image)
#   - :v25-slim    -> Dockerfile (HTTP server for local docker-compose testing)

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: "304975023707"
    ECR_REPO: ragflow
    IMAGE_TAG: v25
    DOCKER_BUILDKIT: "1"

phases:
  pre_build:
    commands:
      - echo "Build started on $(date)"
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO
      - echo "Logging in to ECR ${REPO_URI}..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo "Source commit $CODEBUILD_RESOLVED_SOURCE_VERSION"

  build:
    commands:
      # ECR repo is IMMUTABLE — skip Lambda build/push if :v25 already exists.
      # Saves ~6 min per iteration. To force rebuild: delete the v25 tag in ECR.
      - LAMBDA_EXISTS=$(aws ecr describe-images --repository-name $ECR_REPO --region $AWS_DEFAULT_REGION --image-ids imageTag=$IMAGE_TAG --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
      - |
        if [ -n "$LAMBDA_EXISTS" ] && [ "$LAMBDA_EXISTS" != "None" ]; then
          echo "=== Skipping Lambda build — $REPO_URI:$IMAGE_TAG already in ECR ($LAMBDA_EXISTS) ==="
        else
          echo "=== Building Lambda image (production) ==="
          docker build --build-arg LIGHTEN=1 -f Dockerfile.lambda -t $REPO_URI:$IMAGE_TAG .
          echo "=== Pushing $REPO_URI:$IMAGE_TAG (Lambda) ==="
          docker push $REPO_URI:$IMAGE_TAG
        fi
      # Pre-pull ubuntu:24.04 from ECR Public Gallery to dodge Docker Hub rate
      # limits (CodeBuild IPs are heavily shared and frequently throttled).
      - echo "=== Pre-pulling ubuntu:24.04 via public.ecr.aws mirror ==="
      - docker pull public.ecr.aws/ubuntu/ubuntu:24.04
      - docker tag public.ecr.aws/ubuntu/ubuntu:24.04 ubuntu:24.04
      # Same idempotency check for slim
      - SLIM_EXISTS=$(aws ecr describe-images --repository-name $ECR_REPO --region $AWS_DEFAULT_REGION --image-ids imageTag=$IMAGE_TAG-slim --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
      - |
        if [ -n "$SLIM_EXISTS" ] && [ "$SLIM_EXISTS" != "None" ]; then
          echo "=== Skipping slim build — $REPO_URI:$IMAGE_TAG-slim already in ECR ($SLIM_EXISTS) ==="
        else
          echo "=== Building slim image (local docker-compose testing) ==="
          docker build -f Dockerfile -t $REPO_URI:$IMAGE_TAG-slim . || (echo "Slim build failed" && exit 1)
        fi

  post_build:
    commands:
      - |
        SLIM_EXISTS=$(aws ecr describe-images --repository-name $ECR_REPO --region $AWS_DEFAULT_REGION --image-ids imageTag=$IMAGE_TAG-slim --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")
        if [ -n "$SLIM_EXISTS" ] && [ "$SLIM_EXISTS" != "None" ]; then
          echo "Slim image already in ECR ($SLIM_EXISTS); skipping push"
        elif docker image inspect $REPO_URI:$IMAGE_TAG-slim >/dev/null 2>&1; then
          echo "=== Pushing $REPO_URI:$IMAGE_TAG-slim ==="
          docker push $REPO_URI:$IMAGE_TAG-slim
        else
          echo "Slim image not built; skipping push"
        fi
      - echo "Build complete on $(date)"
      - echo "Lambda image  -> $REPO_URI:$IMAGE_TAG"
      - echo "Slim image    -> $REPO_URI:$IMAGE_TAG-slim (if built)"
