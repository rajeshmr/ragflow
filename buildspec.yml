version: 0.2

# CodeBuild spec for the v25 fork.
# Builds two images and pushes both to 304975023707.dkr.ecr.us-east-1.amazonaws.com/ragflow:
#   - :v25         -> Dockerfile.lambda (production AWS Lambda image)
#   - :v25-slim    -> Dockerfile (HTTP server for local docker-compose testing)

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    AWS_ACCOUNT_ID: "304975023707"
    ECR_REPO: ragflow
    IMAGE_TAG: v25
    DOCKER_BUILDKIT: "1"

phases:
  pre_build:
    commands:
      - echo "Build started on $(date)"
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO
      - echo "Logging in to ECR ${REPO_URI}..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo "Source commit $CODEBUILD_RESOLVED_SOURCE_VERSION"

  build:
    commands:
      - echo "=== Building Lambda image (production) ==="
      - docker build --build-arg LIGHTEN=1 -f Dockerfile.lambda -t $REPO_URI:$IMAGE_TAG .
      # Push Lambda image immediately so production has v25 even if the slim
      # build below fails (Docker Hub rate-limits, etc).
      - echo "=== Pushing $REPO_URI:$IMAGE_TAG (Lambda) ==="
      - docker push $REPO_URI:$IMAGE_TAG
      # Pre-pull ubuntu:24.04 from ECR Public Gallery to dodge Docker Hub rate
      # limits (CodeBuild IPs are heavily shared and frequently throttled).
      - echo "=== Pre-pulling ubuntu:24.04 via public.ecr.aws mirror ==="
      - docker pull public.ecr.aws/ubuntu/ubuntu:24.04
      - docker tag public.ecr.aws/ubuntu/ubuntu:24.04 ubuntu:24.04
      - echo "=== Building slim image (local docker-compose testing) ==="
      - docker build -f Dockerfile -t $REPO_URI:$IMAGE_TAG-slim . || (echo "Slim build failed; Lambda image is already pushed" && exit 0)

  post_build:
    commands:
      - if docker image inspect $REPO_URI:$IMAGE_TAG-slim >/dev/null 2>&1; then echo "=== Pushing $REPO_URI:$IMAGE_TAG-slim ==="; docker push $REPO_URI:$IMAGE_TAG-slim; else echo "Slim image not built; skipping push"; fi
      - echo "Build complete on $(date)"
      - echo "Lambda image  -> $REPO_URI:$IMAGE_TAG"
      - echo "Slim image    -> $REPO_URI:$IMAGE_TAG-slim (if built)"
